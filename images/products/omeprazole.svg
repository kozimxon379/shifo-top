<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="obg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5f3ff" />
      <stop offset="100%" stop-color="#ede9fe" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>
    <linearGradient id="yellowCap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#6d28d9" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#obg)" />

  <g filter="url(#shadow)">
    <!-- Medicine Box -->
    <rect x="90" y="55" width="220" height="150" rx="14" fill="#ffffff" stroke="#ddd6fe" stroke-width="2" />
    <rect x="90" y="55" width="220" height="42" rx="14" fill="url(#purpleGrad)" />
    <text x="200" y="82" font-family="system-ui, sans-serif" font-size="13" font-weight="900" fill="#ffffff" text-anchor="middle">GASTRO PROTECT</text>

    <text x="200" y="128" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#5b21b6" text-anchor="middle">OMEPRAZOL</text>
    <text x="200" y="150" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#7c3aed" text-anchor="middle">20 mg</text>
    <text x="200" y="172" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">Oshqozon va jigildak qaynashiga qarshi</text>
  </g>

  <!-- Dual Color Capsule (Purple + Yellow) -->
  <g filter="url(#shadow)" transform="translate(200, 235) rotate(-15)">
    <!-- Half Purple -->
    <path d="M-35 -14 h35 v28 h-35 a14 14 0 0 1 -14 -14 a14 14 0 0 1 14 -14 Z" fill="url(#purpleGrad)" />
    <!-- Half Yellow -->
    <path d="M0 -14 h35 a14 14 0 0 1 14 14 a14 14 0 0 1 -14 14 h-35 Z" fill="url(#yellowCap)" />
    <!-- Highlight -->
    <ellipse cx="-15" cy="-5" rx="14" ry="4" fill="#ffffff" opacity="0.4" />
    <ellipse cx="20" cy="-5" rx="14" ry="4" fill="#ffffff" opacity="0.4" />
  </g>
</svg>
