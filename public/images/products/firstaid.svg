<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="fabg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1f2" />
      <stop offset="100%" stop-color="#ffe4e6" />
    </linearGradient>
    <linearGradient id="caseRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#be123c" flood-opacity="0.2" />
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#fabg)" />

  <!-- First Aid Kit Suitcase -->
  <g filter="url(#shadow)">
    <!-- Suitcase Handle -->
    <path d="M165 65 C165 40, 235 40, 235 65" stroke="#9f1239" stroke-width="12" stroke-linecap="round" fill="none" />

    <!-- Main Case Body -->
    <rect x="90" y="65" width="220" height="170" rx="24" fill="url(#caseRed)" stroke="#ffffff" stroke-width="3" />

    <!-- Latches -->
    <rect x="130" y="60" width="22" height="14" rx="4" fill="#cbd5e1" stroke="#475569" stroke-width="1.5" />
    <rect x="248" y="60" width="22" height="14" rx="4" fill="#cbd5e1" stroke="#475569" stroke-width="1.5" />

    <!-- Center White Badge with Red Cross -->
    <circle cx="200" cy="150" r="42" fill="#ffffff" />
    <path d="M200 125 v50 M175 150 h50" stroke="#e11d48" stroke-width="14" stroke-linecap="round" />

    <text x="200" y="215" font-family="system-ui, sans-serif" font-size="11" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1">FIRST AID KIT</text>
  </g>
</svg>
