<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="thbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#dcfce7" />
    </linearGradient>
    <linearGradient id="tealBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#059669" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#thbg)" />

  <!-- Infrared Gun Thermometer -->
  <g filter="url(#shadow)" transform="translate(140, 40)">
    <!-- Gun Head and Sensor -->
    <path d="M40 0 L100 0 C120 0, 130 15, 130 35 L125 90 C120 110, 100 120, 80 120 L55 120 L35 210 C30 225, 10 225, 0 210 L-10 140 C-15 120, -5 90, 5 70 L20 20 C25 5, 30 0, 40 0 Z" fill="url(#tealBody)" stroke="#0d9488" stroke-width="2.5" />

    <!-- Sensor Barrel on left -->
    <rect x="-25" y="15" width="25" height="35" rx="6" fill="#0d9488" />
    <circle cx="-25" cy="32" r="10" fill="#0f766e" />
    <!-- Infrared Red Laser Beam -->
    <line x1="-35" y1="32" x2="-80" y2="32" stroke="#ef4444" stroke-width="3" stroke-dasharray="4 4" opacity="0.8" />

    <!-- Digital Backlit Screen (Green for Normal 36.6°C) -->
    <rect x="50" y="30" width="65" height="45" rx="8" fill="#86efac" stroke="#16a34a" stroke-width="1.5" />
    <text x="82" y="55" font-family="monospace" font-size="18" font-weight="900" fill="#14532d" text-anchor="middle">36.6°C</text>
    <text x="82" y="68" font-family="system-ui, sans-serif" font-size="8" font-weight="800" fill="#15803d" text-anchor="middle">NORMAL</text>

    <!-- Trigger Button -->
    <rect x="18" y="90" width="14" height="25" rx="5" fill="#0d9488" />
  </g>

  <!-- Feature Badge -->
  <rect x="110" y="255" width="180" height="26" rx="13" fill="#059669" />
  <text x="200" y="272" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">1 SONIYADA TEZKOR NATIJA</text>
</svg>
