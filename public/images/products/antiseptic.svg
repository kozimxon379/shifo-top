<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="asbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0284c7" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#asbg)" />

  <!-- Antiseptic Bottle -->
  <g filter="url(#shadow)">
    <!-- Spray Pump Nozzle -->
    <path d="M190 35 L225 35 L225 55 L215 55 L215 65 L185 65 L185 55 L175 55 Z" fill="#0284c7" />
    <rect x="220" y="40" width="10" height="6" rx="2" fill="#0369a1" />
    <!-- Spray mist lines -->
    <line x1="235" y1="38" x2="260" y2="30" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" />
    <line x1="235" y1="43" x2="265" y2="43" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" />
    <line x1="235" y1="48" x2="260" y2="56" stroke="#38bdf8" stroke-width="2" stroke-dasharray="3 3" />

    <!-- Bottle Neck -->
    <rect x="185" y="65" width="30" height="20" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.5" />

    <!-- Bottle Body -->
    <rect x="145" y="85" width="110" height="155" rx="22" fill="url(#bottleGrad)" stroke="#cbd5e1" stroke-width="2" />

    <!-- Label with Protection Shield -->
    <rect x="155" y="110" width="90" height="110" rx="10" fill="url(#shieldGrad)" />
    <!-- Shield Icon -->
    <path d="M200 125 L220 135 L220 155 Q200 170 200 175 Q200 170 180 155 L180 135 Z" fill="#ffffff" />
    <path d="M200 135 v25 M190 148 h20" stroke="#0284c7" stroke-width="3" stroke-linecap="round" />

    <text x="200" y="195" font-family="system-ui, sans-serif" font-size="10" font-weight="900" fill="#ffffff" text-anchor="middle">CHLORHEXIDINE</text>
    <text x="200" y="210" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#bae6fd" text-anchor="middle">0.05% 100ml</text>
  </g>
</svg>
