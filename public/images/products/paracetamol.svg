<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="pbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdfa" />
      <stop offset="100%" stop-color="#ccfbf1" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f766e" flood-opacity="0.15" />
    </filter>
  </defs>

  <rect width="400" height="300" fill="url(#pbg)" />

  <!-- Background decorative pattern -->
  <circle cx="90" cy="80" r="40" fill="#99f6e4" opacity="0.3" />
  <circle cx="320" cy="220" r="50" fill="#99f6e4" opacity="0.3" />

  <!-- Medicine Box -->
  <g filter="url(#shadow)">
    <!-- Main Box -->
    <rect x="90" y="60" width="220" height="150" rx="14" fill="#ffffff" stroke="#99f6e4" stroke-width="2" />
    <!-- Top Teal Header on box -->
    <rect x="90" y="60" width="220" height="40" rx="14" fill="url(#tealGrad)" />
    <!-- Medical Cross -->
    <circle cx="120" cy="80" r="12" fill="#ffffff" />
    <path d="M120 72 v16 M112 80 h16" stroke="#0d9488" stroke-width="3" stroke-linecap="round" />
    <text x="142" y="85" font-family="system-ui, sans-serif" font-size="12" font-weight="900" fill="#ffffff">PHARMA CARE</text>

    <!-- Product title on box -->
    <text x="200" y="130" font-family="system-ui, sans-serif" font-size="20" font-weight="900" fill="#0f766e" text-anchor="middle">PARACETAMOL</text>
    <text x="200" y="152" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#0d9488" text-anchor="middle">500 mg</text>
    <text x="200" y="172" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#64748b" text-anchor="middle">20 tabletka • Og'riq qoldiruvchi</text>
    <line x1="120" y1="185" x2="280" y2="185" stroke="#e2e8f0" stroke-width="2" />
  </g>

  <!-- Blister Pack in Front -->
  <g filter="url(#shadow)">
    <rect x="120" y="180" width="160" height="85" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
    <!-- 8 Blister tablets -->
    <rect x="135" y="195" width="22" height="22" rx="11" fill="#e2e8f0" stroke="#0d9488" stroke-width="2" />
    <rect x="170" y="195" width="22" height="22" rx="11" fill="#e2e8f0" stroke="#0d9488" stroke-width="2" />
    <rect x="205" y="195" width="22" height="22" rx="11" fill="#e2e8f0" stroke="#0d9488" stroke-width="2" />
    <rect x="240" y="195" width="22" height="22" rx="11" fill="#e2e8f0" stroke="#0d9488" stroke-width="2" />

    <rect x="135" y="228" width="22" height="22" rx="11" fill="#e2e8f0" stroke="#0d9488" stroke-width="2" />
    <rect x="170" y="228" width="22" height="22" rx="11" fill="#e2e8f0" stroke="#0d9488" stroke-width="2" />
    <rect x="205" y="228" width="22" height="22" rx="11" fill="#e2e8f0" stroke="#0d9488" stroke-width="2" />
    <rect x="240" y="228" width="22" height="22" rx="11" fill="#e2e8f0" stroke="#0d9488" stroke-width="2" />
  </g>
</svg>
